<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="forgot.title">Forgot Password</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../css/Forgot_Password.css" />
    <script src="/FE/js/i18n.js"></script>
    <style>
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="container">
        <div class="icon"><i class="bx bx-mail-send"></i></div>

        <h2 data-i18n="forgot.title">Forgot Password</h2>
        <p data-i18n="forgot.desc">
          Enter your registered email to receive an OTP for password reset.
        </p>

        <form id="forgotForm">
          <div class="input_box">
            <input
              id="email"
              type="email"
              data-i18n-placeholder="placeholder.email"
              placeholder="Enter your email"
              autocomplete="email"
              inputmode="email"
              required
            />
            <i class="bx bx-envelope"></i>
          </div>

          <button type="submit" class="btn" data-i18n="pw.send_otp">
            Send OTP
          </button>

          <p id="error" class="error" role="alert" aria-live="assertive"></p>
        </form>
      </div>

      <script>
        const T = (k, fallback) => window.i18n?.t(k) || fallback;

        document
          .getElementById("forgotForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const error = document.getElementById("error");
            const submitBtn = document.querySelector(".btn");

            // validate email trước khi gọi API
            const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            if (!emailOk) {
              error.textContent = T(
                "alert.invalid_email",
                "Invalid email. Please check again."
              );
              return;
            }

            submitBtn.disabled = true;
            submitBtn.setAttribute("aria-busy", "true");
            submitBtn.textContent = T("pw.sending_otp", "Sending...");
            error.textContent = "";

            try {
              const response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
              });
              const data = await response.json();

              if (response.ok && data.success) {
                alert(T("pw.otp_sent_ok", "OTP has been sent to your email."));
                sessionStorage.setItem("resetEmail", email);
                window.location.href = `/verify-otp?mode=reset&email=${encodeURIComponent(
                  email
                )}`;
              } else {
                error.textContent =
                  data.message ||
                  T(
                    "alert.save_failed",
                    "Something went wrong. Please try again."
                  );
              }
            } catch (err) {
              console.error("Error:", err);
              error.textContent = T(
                "alert.network_error",
                "Cannot connect to server. Please check your network."
              );
            } finally {
              submitBtn.disabled = false;
              submitBtn.removeAttribute("aria-busy");
              submitBtn.textContent = T("pw.send_otp", "Send OTP"); // trả về text theo ngôn ngữ
            }
          });

        // nếu trang có nút đổi ngôn ngữ và setLang() được gọi, đoạn dưới giúp cập nhật nút ngay
        window.addEventListener("lang-changed", () => {
          document.querySelector(".btn").textContent = T(
            "pw.send_otp",
            "Send OTP"
          );
          document.title = T("forgot.title", document.title);
        });
      </script>
    </main>
  </body>
</html>
