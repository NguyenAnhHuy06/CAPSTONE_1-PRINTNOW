<!-- FE/html/Login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.page_title">Login | PrintNow</title>

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../css/Login.css" />

    <!-- i18n -->
    <script src="../js/i18n.js"></script>

    <style>
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      #loginForm .btn {
        display: block;
        margin: 16px auto 0;
        min-width: 180px;
        width: auto;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="bx bx-printer" aria-hidden="true"></i>
        </div>
        <div class="text">
          <h1>PrintNow</h1>
          <p data-i18n="nav.tagline">Print service</p>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="form-box">
        <div class="form-icon">
          <div class="icon-circle">
            <i class="bx bx-printer" aria-hidden="true"></i>
          </div>
        </div>

        <h2 data-i18n="login.welcome">Welcome back!</h2>
        <p class="subtext" data-i18n="login.subtext">Login to your account</p>

        <form id="loginForm" action="/api/auth/login" method="post" novalidate>
          <div class="input_box">
            <input
              id="email"
              name="email"
              type="email"
              data-i18n-placeholder="login.placeholder_email"
              placeholder="Email Address"
              required
              autocomplete="email"
              inputmode="email"
            />
            <i class="bx bx-envelope icon-left" aria-hidden="true"></i>
          </div>

          <div class="input_box">
            <input
              id="password"
              name="password"
              type="password"
              data-i18n-placeholder="login.placeholder_password"
              placeholder="Password"
              required
              autocomplete="current-password"
              minlength="8"
            />
            <i class="bx bx-lock-alt icon-left" aria-hidden="true"></i>
            <i
              id="eye-pass"
              class="bx bx-eye-closed icon-right"
              role="button"
              tabindex="0"
              data-i18n-aria-label="a11y.toggle_password"
              aria-label="Toggle password visibility"
            ></i>
          </div>

          <div
            id="form-message"
            role="status"
            aria-live="polite"
            class="sr-only"
          ></div>

          <button type="submit" class="btn" data-i18n="login.button">
            Login
          </button>
        </form>

        <a
          class="recover-pass"
          href="/forgot-password"
          data-i18n="login.recover"
          >Recover Password</a
        >

        <p class="login-text">
          <span data-i18n="login.no_account">Don't have an account?</span>
          <a href="/register" data-i18n="login.signup">Sign Up</a>
        </p>
      </div>
    </main>

    <!-- apiService (để dùng authMe nếu có) -->
    <script src="../js/apiService.js"></script>

    <script>
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-pass");
      const loginForm = document.getElementById("loginForm");
      const msg = document.getElementById("form-message");
      const T = (k, fallback) => (window.i18n?.t ? window.i18n.t(k) : fallback);
      const getLang = () =>
        String(
          window.i18n?.getLang?.() || document.documentElement.lang || "en"
        ).toLowerCase();

      function normalizeRole(role) {
        return String(role || "")
          .trim()
          .toLowerCase();
      }
      function isCustomer(role) {
        role = normalizeRole(role);
        return role === "customer";
      }
      function isStaff(role) {
        role = normalizeRole(role);
        return role === "staff" || role === "employee";
      }
      function isOwner(role) {
        role = normalizeRole(role);
        return role === "owner" || role === "admin";
      }
      function getRoleFromLoginResponse(data) {
        // hỗ trợ nhiều format response khác nhau
        return (
          data?.user?.role ||
          data?.user?.userRole ||
          data?.role ||
          data?.user?.type ||
          data?.user?.accountType ||
          ""
        );
      }

      async function fetchMyRole(token) {
        try {
          const headers = {};
          if (token) headers.Authorization = `Bearer ${token}`;
          const res = await fetch("/api/auth/me", {
            method: "GET",
            credentials: "include",
            headers,
          });
          const me = await res.json().catch(() => ({}));
          if (!res.ok || me?.success === false) return "";
          return me?.user?.role || me?.role || me?.user?.userRole || "";
        } catch {
          return "";
        }
      }

      async function smartRedirect(candidates, fallback) {
        for (const url of candidates) {
          try {
            // dùng GET để tương thích server không hỗ trợ HEAD
            const r = await fetch(url, {
              method: "GET",
              credentials: "include",
            });
            if (r.ok) {
              window.location.href = url;
              return;
            }
          } catch {}
        }
        window.location.href = fallback;
      }

      async function redirectAfterLogin(data) {
        const token =
          data?.token ||
          (() => {
            try {
              return localStorage.getItem("token");
            } catch {
              return "";
            }
          })();

        let role = getRoleFromLoginResponse(data);
        if (!role) {
          role = await fetchMyRole(token);
        }
        role = normalizeRole(role);

        // Bạn có thể chỉnh lại candidates theo đúng route static của project
        if (isStaff(role)) {
          return smartRedirect(
            ["/Employee_Dashboard.html", "/FE/html/Employee_Dashboard.html"],
            "/Employee_Dashboard.html"
          );
        }
        if (isOwner(role)) {
          return smartRedirect(
            ["/Owner_Dashboard.html", "/FE/html/Owner_Dashboard.html"],
            "/Owner_Dashboard.html"
          );
        }
        // default: customer
        return smartRedirect(
          ["/home", "/Home_customer.html", "/FE/html/Home_customer.html"],
          "/home"
        );
      }

      // ===== Auto redirect if already logged in =====
      async function authMeSafe() {
        // 1) Prefer apiService.js if it exposes authMe()
        try {
          if (
            window.apiService &&
            typeof window.apiService.authMe === "function"
          ) {
            const r = await window.apiService.authMe();
            // support multiple shapes: {success, user}, {user}, {data:{user}}, ...
            const u = r?.user || r?.data?.user || r?.data || r;
            if (u && r?.success !== false) return u;
          }
        } catch {}

        // 2) Fallback: call /api/auth/me directly (cookie httpOnly OR bearer token)
        try {
          let token = "";
          try {
            token = localStorage.getItem("token") || "";
          } catch {}
          const headers = {};
          if (token) headers.Authorization = `Bearer ${token}`;

          const res = await fetch("/api/auth/me", {
            method: "GET",
            credentials: "include",
            headers,
          });
          const me = await res.json().catch(() => ({}));
          if (!res.ok || me?.success === false) return null;
          return me?.user || me;
        } catch {
          return null;
        }
      }

      async function autoRedirectIfLoggedIn() {
        const me = await authMeSafe();
        if (!me) return;

        const role =
          me?.role ||
          me?.userRole ||
          me?.type ||
          me?.accountType ||
          me?.user?.role ||
          "";
        if (!role) return;

        setMsg(
          T("login.redirecting", "You're already logged in. Redirecting..."),
          true
        );
        // reuse the same redirect logic
        redirectAfterLogin({ user: { role } });
      }

      function setMsg(text = "", ok = false) {
        if (!text) {
          msg.textContent = "";
          msg.classList.add("sr-only");
          return;
        }
        msg.classList.remove("sr-only");
        msg.textContent = text;
        msg.style.color = ok ? "#2e7d32" : "#c62828";
      }

      // run once on page load
      (function () {
        try {
          const t = Number(sessionStorage.getItem("justLoggedOutAt") || "0");
          if (t && Date.now() - t < 1500) return; // skip auto-redirect ngay sau logout
        } catch {}
        autoRedirectIfLoggedIn();
      })();

      // Toggle password visibility (click/keyboard)
      eyeIcon.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.classList.toggle("active", isPassword);
        eyeIcon.classList.replace(
          isPassword ? "bx-eye-closed" : "bx-eye",
          isPassword ? "bx-eye" : "bx-eye-closed"
        );
      });
      eyeIcon.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " " || e.code === "Space") {
          e.preventDefault();
          eyeIcon.click();
        }
      });

      // Submit
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = loginForm.querySelector(".btn");
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        // simple email check
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!emailOk) {
          setMsg(
            T("alert.invalid_email", "Invalid email. Please check again.")
          );
          btn.disabled = false;
          return;
        }

        setMsg("");
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (response.ok && data.success) {
            // Lưu token để apiService.js / realtime.js dùng được (song song cookie httpOnly)
            if (data.token) {
              try {
                localStorage.setItem("token", data.token);
              } catch {}
            }
            setMsg(T("login.success", "Logged in successfully!"), true);
            setTimeout(() => {
              redirectAfterLogin(data);
            }, 400);
          } else {
            setMsg(data.message || T("login.failed", "Login failed"));
          }
        } catch (error) {
          console.error("Login error:", error);
          setMsg(
            T(
              "alert.network_error",
              "Cannot connect to server. Please check your network."
            )
          );
        } finally {
          btn.disabled = false;
        }
      });

      // cập nhật tiêu đề/nút khi đổi ngôn ngữ ở nơi khác
      window.addEventListener("lang-changed", () => {
        document.title = T("login.page_title", document.title);
        document.querySelector(".btn").textContent = T("login.button", "Login");
      });
    </script>
  </body>
</html>
