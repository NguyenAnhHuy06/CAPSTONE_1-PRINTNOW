<!-- FE/html/Login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.page_title">Login | PrintNow</title>

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../css/Login.css" />

    <!-- i18n -->
    <script src="/FE/js/i18n.js"></script>

    <style>
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      #loginForm .btn {
        display: block;
        margin: 16px auto 0;
        min-width: 180px;
        width: auto;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="bx bx-printer" aria-hidden="true"></i>
        </div>
        <div class="text">
          <h1>PrintNow</h1>
          <p data-i18n="nav.tagline">Print service</p>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="form-box">
        <div class="form-icon">
          <div class="icon-circle">
            <i class="bx bx-printer" aria-hidden="true"></i>
          </div>
        </div>

        <h2 data-i18n="login.welcome">Welcome back!</h2>
        <p class="subtext" data-i18n="login.subtext">Login to your account</p>

        <form id="loginForm" action="/api/auth/login" method="post" novalidate>
          <div class="input_box">
            <input
              id="email"
              name="email"
              type="email"
              data-i18n-placeholder="login.placeholder_email"
              placeholder="Email Address"
              required
              autocomplete="email"
              inputmode="email"
            />
            <i class="bx bx-envelope icon-left" aria-hidden="true"></i>
          </div>

          <div class="input_box">
            <input
              id="password"
              name="password"
              type="password"
              data-i18n-placeholder="login.placeholder_password"
              placeholder="Password"
              required
              autocomplete="current-password"
              minlength="8"
            />
            <i class="bx bx-lock-alt icon-left" aria-hidden="true"></i>
            <i
              id="eye-pass"
              class="bx bx-eye-closed icon-right"
              role="button"
              tabindex="0"
              data-i18n-aria-label="a11y.toggle_password"
              aria-label="Toggle password visibility"
            ></i>
          </div>

          <div
            id="form-message"
            role="status"
            aria-live="polite"
            class="sr-only"
          ></div>

          <button type="submit" class="btn" data-i18n="login.button">
            Login
          </button>
        </form>

        <a
          class="recover-pass"
          href="/forgot-password"
          data-i18n="login.recover"
          >Recover Password</a
        >

        <p class="login-text">
          <span data-i18n="login.no_account">Don't have an account?</span>
          <a href="/register" data-i18n="login.signup">Sign Up</a>
        </p>
      </div>
    </main>

    <script>
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-pass");
      const loginForm = document.getElementById("loginForm");
      const msg = document.getElementById("form-message");
      const T = (k, fallback) => window.i18n?.t(k) || fallback;

      function setMsg(text = "", ok = false) {
        if (!text) {
          msg.textContent = "";
          msg.classList.add("sr-only");
          return;
        }
        msg.classList.remove("sr-only");
        msg.textContent = text;
        msg.style.color = ok ? "#2e7d32" : "#c62828";
      }

      // Toggle password visibility (click/keyboard)
      eyeIcon.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.classList.toggle("active", isPassword);
        eyeIcon.classList.replace(
          isPassword ? "bx-eye-closed" : "bx-eye",
          isPassword ? "bx-eye" : "bx-eye-closed"
        );
      });
      eyeIcon.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " " || e.code === "Space") {
          e.preventDefault();
          eyeIcon.click();
        }
      });

      // Submit
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = loginForm.querySelector(".btn");
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        // simple email check
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!emailOk) {
          setMsg(
            T("alert.invalid_email", "Invalid email. Please check again.")
          );
          btn.disabled = false;
          return;
        }

        setMsg("");
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (response.ok && data.success) {
            setMsg(T("login.success", "Logged in successfully!"), true);
            setTimeout(() => {
              window.location.href = "/home";
            }, 800);
          } else {
            setMsg(data.message || T("login.failed", "Login failed"));
          }
        } catch (error) {
          console.error("Login error:", error);
          setMsg(
            T(
              "alert.network_error",
              "Cannot connect to server. Please check your network."
            )
          );
        } finally {
          btn.disabled = false;
        }
      });

      // cập nhật tiêu đề/nút khi đổi ngôn ngữ ở nơi khác
      window.addEventListener("lang-changed", () => {
        document.title = T("login.page_title", document.title);
        document.querySelector(".btn").textContent = T("login.button", "Login");
      });
    </script>
  </body>
</html>
