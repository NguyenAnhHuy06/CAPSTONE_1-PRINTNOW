<!-- FE/html/Register.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="register.page_title">PrintNow - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/Register.css" />

    <!-- i18n -->
    <script src="/FE/js/i18n.js"></script>

    <style>
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      #registerForm .btn {
        display: block;
        margin: 16px auto 0;
        min-width: 180px;
        width: auto;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="bx bx-printer" aria-hidden="true"></i>
        </div>
        <div class="text">
          <h1>PrintNow</h1>
          <p data-i18n="nav.tagline">Print service</p>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="form-box">
        <div class="form-icon">
          <div class="icon-circle">
            <i class="bx bx-printer" aria-hidden="true"></i>
          </div>
        </div>

        <h2>
          <span data-i18n="register.heading_prefix">Get Started with</span>
          <span class="highlight">PrintNow</span>
        </h2>
        <p class="subtext" data-i18n="register.subtext">
          Create your free account
        </p>

        <form id="registerForm" novalidate>
          <div class="input_box">
            <input
              id="fullName"
              type="text"
              data-i18n-placeholder="register.placeholder_fullname"
              placeholder="Your Full Name"
              required
              maxlength="50"
              autocomplete="name"
            />
            <i class="bx bx-user icon-left" aria-hidden="true"></i>
          </div>

          <div class="input_box">
            <input
              id="email"
              type="email"
              data-i18n-placeholder="register.placeholder_email"
              placeholder="Your Email Address"
              required
              maxlength="50"
              autocomplete="email"
              inputmode="email"
            />
            <i class="bx bx-envelope icon-left" aria-hidden="true"></i>
          </div>

          <div class="input_box">
            <input
              id="phone"
              type="tel"
              data-i18n-placeholder="register.placeholder_phone"
              placeholder="Your Phone Number"
              required
              maxlength="10"
              pattern="[0-9]{10}"
              autocomplete="tel"
              inputmode="tel"
            />
            <i class="bx bx-phone icon-left" aria-hidden="true"></i>
          </div>

          <div class="input_box">
            <input
              id="password"
              type="password"
              data-i18n-placeholder="register.placeholder_password"
              placeholder="Create a Strong Password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <i class="bx bx-lock-alt icon-left" aria-hidden="true"></i>
            <i
              id="eye-pass"
              class="bx bx-eye-closed icon-right"
              role="button"
              tabindex="0"
              data-i18n-aria-label="a11y.toggle_password"
              aria-label="Toggle password visibility"
            ></i>
          </div>

          <div
            id="form-message"
            role="status"
            aria-live="polite"
            class="sr-only"
          ></div>

          <button type="submit" class="btn" data-i18n="register.button">
            Sign Up
          </button>
        </form>

        <p class="login-text">
          <span data-i18n="register.have_account"
            >Already have an account?</span
          >
          <a href="/login" data-i18n="register.login">Login</a>
        </p>
      </div>
    </main>

    <script>
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-pass");
      const registerForm = document.getElementById("registerForm");
      const msg = document.getElementById("form-message");
      const T = (k, fallback) => window.i18n?.t(k) || fallback;

      function setMsg(text = "", ok = false) {
        if (!text) {
          msg.textContent = "";
          msg.classList.add("sr-only");
          return;
        }
        msg.classList.remove("sr-only");
        msg.textContent = text;
        msg.style.color = ok ? "#2e7d32" : "#c62828";
      }

      // Toggle password visibility
      eyeIcon.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.classList.toggle("active", isPassword);
        eyeIcon.classList.replace(
          isPassword ? "bx-eye-closed" : "bx-eye",
          isPassword ? "bx-eye" : "bx-eye-closed"
        );
      });
      eyeIcon.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " " || e.code === "Space") {
          e.preventDefault();
          eyeIcon.click();
        }
      });

      // Submit
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = registerForm.querySelector(".btn");
        btn.disabled = true;

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim().replace(/\D/g, ''); // Chỉ lấy số
        const password = passwordInput.value;

        // basic validations
        if (!fullName || !email) {
          setMsg(
            T(
              "alert.missing_customer_info",
              "Please enter your Full Name and Email."
            )
          );
          btn.disabled = false;
          return;
        }
        
        // Validate fullName: tối đa 50 ký tự
        if (fullName.length > 50) {
          setMsg(
            T("alert.fullname_maxlen", "Tên đăng nhập không được vượt quá 50 ký tự")
          );
          btn.disabled = false;
          return;
        }
        
        // Validate email: format và tối đa 50 ký tự
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!emailOk) {
          setMsg(
            T("alert.invalid_email", "Invalid email. Please check again.")
          );
          btn.disabled = false;
          return;
        }
        if (email.length > 50) {
          setMsg(
            T("alert.email_maxlen", "Email không được vượt quá 50 ký tự")
          );
          btn.disabled = false;
          return;
        }
        
        // Validate phone: đúng 10 số
        if (!phone || phone.length !== 10 || !/^[0-9]{10}$/.test(phone)) {
          setMsg(
            T("alert.phone_invalid", "Số điện thoại phải có đúng 10 chữ số")
          );
          btn.disabled = false;
          return;
        }
        
        // Validate password: tối thiểu 8 ký tự, có chữ in hoa, ký tự đặc biệt, chữ thường và số
        if (password.length < 8) {
          setMsg(
            T("alert.pw_minlen", "Mật khẩu phải có ít nhất 8 ký tự")
          );
          btn.disabled = false;
          return;
        }
        const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?])/;
        if (!passwordRegex.test(password)) {
          setMsg(
            T("alert.pw_complexity", "Mật khẩu phải có ít nhất 1 chữ in hoa, 1 chữ thường, 1 số và 1 ký tự đặc biệt")
          );
          btn.disabled = false;
          return;
        }

        setMsg("");
        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullName, email, phone: phone, password }),
          });
          const data = await response.json();

          if (response.ok && (data.success ?? true)) {
            localStorage.setItem("registrationEmail", email);
            setMsg(
              T(
                "register.success",
                "Sign up successful! Please check your email for the OTP."
              ),
              true
            );
            // chuyển sang trang xác thực OTP
            setTimeout(() => {
              window.location.href =
                "/verify-otp?email=" + encodeURIComponent(email);
            }, 700);
          } else {
            setMsg(data.message || T("register.failed", "Registration failed"));
          }
        } catch (error) {
          console.error("Registration error:", error);
          setMsg(
            T(
              "alert.network_error",
              "Cannot connect to server. Please check your network."
            )
          );
        } finally {
          btn.disabled = false;
        }
      });

      // cập nhật tiêu đề/nút khi đổi ngôn ngữ
      window.addEventListener("lang-changed", () => {
        document.title = T("register.page_title", document.title);
        document.querySelector(".btn").textContent = T(
          "register.button",
          "Sign Up"
        );
      });
    </script>
  </body>
</html>
