<!-- FE/html/PrintDocument.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="print_doc.page_title">Print Documents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Thử thay thế đường dẫn cũ -->
  <script src="https://unpkg.com/pdfjs-dist@2.9.359/legacy/build/pdf.min.js"></script>
  <script>
    // Cấu hình worker cho PDF.js từ CDN
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://unpkg.com/pdfjs-dist@4.2.67/legacy/build/pdf.worker.min.js";
    }
  </script>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      display: flex;
      gap: 24px;
    }

    .left-panel {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      padding: 28px 32px;
    }

    .right-panel {
      width: 300px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: fit-content;
    }

    .page-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .page-header>div h2 {
      margin-bottom: 5px !important;
    }

    .page-header>div p {
      margin-top: -2px !important;
      line-height: 1;
    }

    .page-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .page-header p {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .btn-back {
      text-decoration: none;
      color: #374151;
      font-size: 1.4rem;
      transition: color 0.2s ease;
    }

    .btn-back:hover {
      color: #007bff;
      /* transform: translateX(-3px); */
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: #222;
    }

    p.subtitle {
      color: #777;
      margin: 5px 0 20px 0;
    }

    .section {
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      padding: 5px 25px 25px 25px;
      margin-top: 20px;
      background: #fff;
    }

    .section h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #222;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    /* .card h3 {
        font-size: 1.1rem;
        margin-bottom: 15px;
        } */

    .input-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .input-group .input-field {
      padding-right: 20px;
    }

    .input-field {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .input-field label {
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #000;
    }

    .input-field label > span:first-child {
      color: #000;
    }

    .input-field label > span:last-child {
      color: #ef4444;
    }

    .input-field input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .input-field input:invalid {
      border-color: #ef4444;
    }

    .input-field input:focus:invalid {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .file-upload {
      border: 2px dashed #b5b5b5;
      border-radius: 10px;
      text-align: center;
      padding: 35px;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-upload:hover {
      border-color: #007bff;
      background: #f0f8ff;
    }

    .file-upload input {
      display: none;
    }

    .uploaded-file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f3f4f6;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      font-size: 0.9rem;
    }

    .uploaded-file-item i {
      color: #10b981;
      font-size: 1.1rem;
    }

    .uploaded-file-item span {
      flex: 1;
      color: #374151;
      word-break: break-word;
    }

    textarea {
      width: 97%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-top: 6px;
      font-size: 0.95rem;
      resize: vertical;
    }

    .file-config {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .file-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remove-btn {
      color: red;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .arrow {
      transition: transform 0.3s ease;
      font-size: 13px;
    }

    .arrow.open {
      transform: rotate(90deg);
    }

    .file-details {
      display: none;
      margin-top: 15px;
    }

    .option-group {
      margin-top: 10px;
    }

    .flex-row {
      display: flex;
      gap: 10px;
    }

    .option-group.flex-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .option-group.flex-row>div {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 100px;
    }

    .option-group.flex-row label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 6px;
    }

    .option-group.flex-row input,
    .option-group.flex-row select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .option-group.flex-row input:focus,
    .option-group.flex-row select:focus {
      border-color: #155dfc;
      box-shadow: 0 0 0 2px rgba(26, 79, 213, 0.2);
      outline: none;
    }

    .option-group.flex-row select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg fill='none' stroke='%236366f1' stroke-width='2' viewBox='0 0 24 24'%3E%3Cpath d='M6 9l6 6 6-6'%3E%3C/path%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 32px;
      cursor: pointer;
    }

    /* Style riêng cho radio */

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
    }

    .radio-group .radio-row label {
      font-weight: 400;
      font-size: 16px;
      color: #374151;
    }

    .radio-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .radio-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .radio-row label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label span {
      white-space: nowrap;
    }

    /* Style riêng cho checkbox */

    .checkbox-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: 28px;
      padding-left: 10px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .checkbox-options.show {
      max-height: 80px;
      opacity: 1;
    }

    .checkbox-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      color: #374151;
      font-size: 16px;
    }

    .checkbox-options input[type="checkbox"] {
      width: auto;
      /*Giúp checkbox không bị kéo căng hết chiều rộng */
      padding: 0;
      margin: 0;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      height: 16px;
      width: 16px;
    }

    /* Thêm CSS để chữ nằm bên phải checkbox */

    .checkbox-options label {
      justify-content: flex-start;
    }

    /* Style cho ô input số trang màu */

    .combination-options {
      margin-left: 28px;
      padding-left: 10px;
      margin-top: 0px;
      /* Hiệu ứng trượt và ẩn ban đầu */
      display: flex;
      flex-direction: column;
      gap: 4px;
      /* Ẩn ban đầu */
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.3s ease-out;
    }

    .combination-options.show {
      max-height: 100px;
      opacity: 1;
    }

    .combination-options label {
      font-weight: 400;
      font-size: 16px;
      color: #374151;
      margin-bottom: 0;
      display: block;
    }

    .combination-options textarea {
      width: 250px;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 2px;
      resize: vertical;
    }

    /* RIGHT-PANEL*/

    .order-summary-header {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .summary-file {
      background: #f2f4f7;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .summary-file strong {
      display: block;
      /* Quan trọng để áp dụng width và overflow */
      max-width: 170px;
      /* Điều chỉnh độ rộng tối đa cho tên file */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      color: #222;
    }

    .summary-file .file-details {
      font-size: 13px;
      color: #555;
      line-height: 1.3;
    }

    .summary-file .file-price {
      font-weight: 600;
      font-size: 13px;
      text-align: right;
      color: #000;
    }

    .order-summary-footer {
      border-top: 1px solid #e5e5e5;
      margin-top: 12px;
      padding-top: 12px;
      font-size: 14px;
    }

    /*  Đảm bảo nhãn ở trái, giá trị ở phải, căn thẳng hàng */

    .order-summary-footer .d-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 6px;
    }

    /* LÀM NỔI BẬT: Dòng Total (thẻ div con thứ 2) */

    .order-summary-footer>div:nth-child(2) {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-top: 8px !important;
    }

    #totalPrice {
      color: #111827;
    }

    .btn-payment {
      background: #374151;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .btn-payment:hover {
      background: #111827;
    }

    small {
      color: #555;
    }

    .config-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-title i {
      color: #555;
    }

    /* A11y helper: văn bản chỉ dành cho screen reader */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>

<body>
  <main role="main">
    <div class="container">
      <div class="left-panel">
        <div class="page-header">
          <a href="javascript:void(0)" aria-label="Go back" class="btn-back" id="backButton" onclick="goBack()"><i
              class="bx bx-arrow-back" aria-hidden="true"></i></a>
          <div>
            <h2 data-i18n="print_doc.title">Print Documents</h2>
            <p data-i18n="print_doc.subtitle">
              Upload files and configure print options for each file
            </p>
          </div>
        </div>

        <div class="section">
          <h3 data-i18n="print_doc.customer_info_title">
            Customer Information
          </h3>
          <div class="input-group">
            <div class="input-field">
              <label>
                <span data-i18n="print_doc.field_full_name_label">
                  Full Name
                </span>
                <span>*</span>
              </label>
              <input type="text" id="customerName" placeholder="Enter full name"
                data-i18n-placeholder="print_doc.field_full_name_placeholder" 
                maxlength="50" 
                pattern="^[a-zA-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƠàáâãèéêìíòóôõùúăđĩũơƯĂẠẢẤẦẨẪẬẮẰẲẴẶẸẺẼỀỀỂưăạảấầẩẫậắằẳẵặẹẻẽềềểỄỆỈỊỌỎỐỒỔỖỘỚỜỞỠỢỤỦỨỪễệỉịọỏốồổỗộớờởỡợụủứừỬỮỰỲỴÝỶỸửữựỳỵýỷỹ\s]+$"
                required />
              <small id="customerNameError" style="color: #ef4444; font-size: 0.85rem; display: none; margin-top: 4px;"></small>
            </div>
            <div class="input-field">
              <label>
                <span data-i18n="print_doc.field_email_label">Email</span>
                <span>*</span>
              </label>
              <input type="email" id="customerEmail" placeholder="Enter email"
                data-i18n-placeholder="print_doc.field_email_placeholder" 
                maxlength="50"
                required />
              <small id="customerEmailError" style="color: #ef4444; font-size: 0.85rem; display: none; margin-top: 4px;"></small>
            </div>
          </div>
        </div>

        <div class="section">
          <h3 data-i18n="print_doc.upload_section_title">Upload file</h3>
          <label class="file-upload">
            <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.ppt,.pptx" />
            <p>
              📄
              <strong data-i18n="print_doc.upload_main">
                Select file to print </strong><br /><small data-i18n="print_doc.upload_helper">Supports PDF, DOC, DOCX,
                PPT, PPTX (max 100MB per file)</small>
            </p>
          </label>
          <div id="uploadedFilesList" style="margin-top: 15px; display: none;">
            <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #374151;">
              <span data-i18n="print_doc.uploaded_files_title">Uploaded files:</span>
            </div>
            <div id="uploadedFilesContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
          </div>
        </div>

        <div class="section">
          <h3 data-i18n="print_doc.special_request_title">Special request</h3>
          <textarea rows="3" id="specialRequest"
            placeholder="For example: deliver before 2pm, print on thicker paper..."
            data-i18n-placeholder="print_doc.special_request_placeholder"></textarea>
        </div>

        <div class="section" id="configSection" style="display: none">
          <h3 class="config-title">
            <i class="bi bi-gear-fill"></i>
            <span data-i18n="print_doc.config_section_title">
              Configure print files
            </span>
          </h3>
          <div id="configContainer"></div>
        </div>
      </div>

      <div class="right-panel">
        <div>
          <div class="order-summary-header">
            <i class="bi bi-list"></i>
            <span data-i18n="print_doc.summary_title">Order Summary</span>
          </div>

          <div id="orderSummaryList">
            <p class="text-muted" data-i18n="print_doc.summary_empty">
              No files uploaded yet
            </p>
          </div>
        </div>

        <div class="order-summary-footer">
          <div class="d-flex justify-content-between">
            <span data-i18n="print_doc.summary_count_label">
              Number of files:
            </span>
            <span id="fileCount">0 files</span>
          </div>
          <div class="d-flex justify-content-between fw-semibold mt-1">
            <span data-i18n="print_doc.summary_total_label">Total:</span>
            <span id="totalPrice">0₫</span>
          </div>
          <button class="btn-payment mt-3" id="btnPay" disabled data-i18n="print_doc.btn_proceed_payment">
            Proceed with payment
          </button>
        </div>
      </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/apiService.js"></script>

    <script>
      // Khởi tạo i18n từ settings backend (nếu có)
      document.addEventListener("DOMContentLoaded", () => {
        if (window.i18n) {
          i18n.translateDom();
          fetch("/api/settings/me", { credentials: "include" })
            .then((r) => r.json())
            .then((data) => {
              if (data?.success && data.setting?.language) {
                i18n.setLang(data.setting.language);
              }
            })
            .catch(() => { });
        }
      });

      // === CÁC BIẾN DOM ===
      const fileInput = document.getElementById("fileInput");
      const configContainer = document.getElementById("configContainer");
      const configSection = document.getElementById("configSection");
      const orderSummaryList = document.getElementById("orderSummaryList");
      const fileCountElement = document.getElementById("fileCount");
      const totalPriceElement = document.getElementById("totalPrice");
      const btnPay = document.getElementById("btnPay");
      const uploadedFilesList = document.getElementById("uploadedFilesList");
      const uploadedFilesContainer = document.getElementById("uploadedFilesContainer");

      // CÁC BIẾN NÀY ĐÃ ĐƯỢC LẤY CHÍNH XÁC NHỜ CÓ ID TRONG HTML
      const customerNameInput = document.getElementById("customerName");
      const customerEmailInput = document.getElementById("customerEmail");
      const specialRequestTextarea =
        document.getElementById("specialRequest");
      const customerNameError = document.getElementById("customerNameError");
      const customerEmailError = document.getElementById("customerEmailError");

      // === VALIDATION FUNCTIONS ===
      function validateFullName(name) {
        // Chỉ cho phép chữ cái (bao gồm tiếng Việt) và khoảng trắng
        const namePattern = /^[a-zA-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƠàáâãèéêìíòóôõùúăđĩũơƯĂẠẢẤẦẨẪẬẮẰẲẴẶẸẺẼỀỀỂưăạảấầẩẫậắằẳẵặẹẻẽềềểỄỆỈỊỌỎỐỒỔỖỘỚỜỞỠỢỤỦỨỪễệỉịọỏốồổỗộớờởỡợụủứừỬỮỰỲỴÝỶỸửữựỳỵýỷỹ\s]+$/;
        return namePattern.test(name);
      }

      function validateEmail(email) {
        // Kiểm tra định dạng email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailPattern.test(email);
      }

      function validateCustomerFields() {
        const name = customerNameInput.value.trim();
        const email = customerEmailInput.value.trim();
        let hasError = false;

        // Reset error messages
        customerNameError.style.display = "none";
        customerNameError.textContent = "";
        customerEmailError.style.display = "none";
        customerEmailError.textContent = "";

        // Kiểm tra nếu một trường được nhập nhưng trường kia chưa
        if (name && !email) {
          customerEmailError.textContent = "Vui lòng nhập email";
          customerEmailError.style.display = "block";
          hasError = true;
        } else if (email && !name) {
          customerNameError.textContent = "Vui lòng nhập họ tên";
          customerNameError.style.display = "block";
          hasError = true;
        }

        // Validate full name format (nếu có giá trị)
        if (name) {
          if (!validateFullName(name)) {
            customerNameError.textContent = "Họ tên chỉ được chứa chữ cái và khoảng trắng";
            customerNameError.style.display = "block";
            hasError = true;
          } else if (name.length > 50) {
            customerNameError.textContent = "Họ tên tối đa 50 ký tự";
            customerNameError.style.display = "block";
            hasError = true;
          }
        }

        // Validate email format (nếu có giá trị)
        if (email) {
          if (!validateEmail(email)) {
            customerEmailError.textContent = "Email không đúng định dạng";
            customerEmailError.style.display = "block";
            hasError = true;
          } else if (email.length > 50) {
            customerEmailError.textContent = "Email tối đa 50 ký tự";
            customerEmailError.style.display = "block";
            hasError = true;
          }
        }

        return !hasError;
      }

      // Event listeners for validation
      customerNameInput.addEventListener("input", function() {
        const name = this.value.trim();
        customerNameError.style.display = "none";
        customerNameError.textContent = "";

        if (name) {
          if (!validateFullName(name)) {
            customerNameError.textContent = "Họ tên chỉ được chứa chữ cái và khoảng trắng";

      let uploadedFiles = [];
      // Đọc preset nếu có (tạo bởi Order_History → Reorder)
      const _reorderPresetRaw = localStorage.getItem("reorderPreset");
      const _reorderPreset = (() => {
        try {
          return JSON.parse(_reorderPresetRaw || "null");
        } catch {
          return null;
        }
      })();
      const docDefaults = (() => {
        if (
          _reorderPreset?.type !== "DOCUMENT" ||
          !_reorderPreset.items?.length
        ) {
          return null;
        }
        // Lấy item đầu tiên làm mặc định chung cho các file mới
        const it = _reorderPreset.items[0];
        return {
          size: it.size || "A4",
          side: it.side || "1 side",
          mode: it.mode || "Black & White",
          type: it.type || "Regular",
          binding: !!it.binding,
          coverPage: !!it.coverPage,
          copies: Number(it.copies || 1),
          colorPages: it.colorPages || "",

      // === HÀM TIỆN ÍCH ===

      // Hàm chuẩn hoá chuỗi (bỏ dấu, khoảng trắng, chữ hoa/thường)
      const norm = (s) =>
        String(s || "")
          .normalize("NFD") // tách dấu
          .replace(/[\u0300-\u036f]/g, "") // bỏ dấu tiếng Việt
          .replace(/\u00A0/g, " ") // NBSP -> space
          .replace(/\s+/g, " ") // gộp khoảng trắng
          .trim()
          .toLowerCase();

      // Hàm format tiền tệ (VND)
      function formatCurrency(amount) {
        // Đảm bảo amount là số
        if (typeof amount !== "number") return "0₫";
        return amount.toLocaleString("vi-VN") + "₫";
      }

      // Chuẩn hoá chế độ in về code nội bộ (bw / color / combination),
      // KHÔNG phụ thuộc ngôn ngữ (Anh / Việt).
      function normalizePrintMode(mode) {
        const m = norm(mode);
        if (!m) return "bw";

        // Ưu tiên "kết hợp" trước vì chuỗi có thể chứa từ "màu"
        if (
          m.includes("combination") ||
          m.includes("ket hop") ||
          m.includes("kết hợp")
        ) {
          return "combination";
        }

        if (
          m.includes("color") ||
          m.includes("mau") || // "màu" -> "mau" sau khi bỏ dấu
          m.includes("in mau") ||
          m.includes("in màu")
        ) {
          return "color";
        }

        if (
          m.includes("black") ||
          m.includes("trang den") || // "trắng đen"
          m === "bw"
        ) {
          return "bw";
        }

        // fallback an toàn
        return "bw";
      }

      // Hàm đếm số trang của file PDF sử dụng PDF.js
      async function getPdfPageCount(file) {
        if (!window.pdfjsLib) return 1;
        try {
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          return pdf.numPages || 1;

          return 1; // fallback an toàn
        }

      fileInput.addEventListener("change", async function () {

          // 1) Upload file lên server TRƯỚC (để lưu vào DB ngay)

          try {

            formData.append("file", file);

              method: "POST",

              if (uploadData?.success && uploadData?.file?.id) {
                fileId = uploadData.file.id;

              }
            } else {
              console.error(`[Upload] Failed to upload file "${file.name}":`, uploadRes.status);
            }
          } catch (uploadErr) {
            console.error(`[Upload] Error uploading file "${file.name}":`, uploadErr);
          }

          // 2) Nếu chưa có số trang từ upload, thử đếm cục bộ (chỉ cho PDF)
          if (pages === 1 && /\.pdf$/i.test(file.name)) {
            try {
              pages = await getPdfPageCount(file);
            } catch (err) {
              console.warn(`[PDF] Không thể đếm trang cho "${file.name}":`, err);
            }

          // 3) Thêm file vào danh sách và cập nhật UI NGAY

          const id = Date.now() + Math.random().toString(16).slice(2);

            type: docDefaults?.type ?? "Regular",
            binding: !!docDefaults?.binding,
            coverPage: !!docDefaults?.coverPage,

            price: defaultPrice,
            fileId: fileId,

          uploadedFiles.push(fileData);

          // ✅ Cập nhật UI ngay sau mỗi file (không đợi tất cả)

        // Đợi tất cả upload xong (nhưng UI đã được cập nhật từng file)
        try {

      // === LOGIC TÍNH TOÁN VÀ ĐỒNG BỘ DỮ LIỆU ===

      // Hàm đếm số trang màu từ chuỗi chỉ định
      function countColorPagesSpec(spec, totalPages) {
        if (!spec) return 0;
        const set = new Set();
        let invalid = false;

        // Xử lý từng token trong chuỗi
        spec
          .split(",")
          .map((s) => s.trim())
          .forEach((tok) => {
            if (/^\d+$/.test(tok)) {
              const n = +tok;
              if (n >= 1 && n <= totalPages) set.add(n);
              else invalid = true;
            } else if (/^\d+\s*-\s*\d+$/.test(tok)) {
              const [a, b] = tok.split("-").map((x) => +x.trim());
              const lo = Math.min(a, b),
                hi = Math.max(a, b);
              for (let i = lo; i <= hi; i++) {
                if (i >= 1 && i <= totalPages) set.add(i);
                else invalid = true;
              }
            } else {
              invalid = true;
            }
          });

        if (invalid)
          console.warn("Color pages spec has invalid tokens:", spec);
        return set.size;
      }

      // Cache giá từ localStorage - lưu theo khổ giấy và chế độ màu
      let pricingConfig = {
        // Giá theo khổ giấy và chế độ màu: { paperSize: { bw: price, color: price } }
        prices: {
          A4: { bw: 500, color: 3000 },
          A3: { bw: 1000, color: 4000 },
          A5: { bw: 500, color: 2000 }
        },
        priceBinding: 5000,
        priceCoverPage: 2000
      };

      // Load giá từ localStorage (ưu tiên) hoặc backend
      async function loadPricingFromBackend() {
        try {
          // 1. Đọc giá từ localStorage trước (nếu có)
          const priceMapping = JSON.parse(localStorage.getItem('priceMapping') || '{}');
          
          // Load giá đen trắng theo khổ giấy
          if (priceMapping['row-printing-1'] && priceMapping['row-printing-1'].price) {
            pricingConfig.prices.A4.bw = Number(priceMapping['row-printing-1'].price);
            console.log('✅ Đã load giá đen trắng A4 từ localStorage:', pricingConfig.prices.A4.bw);
          }
          if (priceMapping['row-printing-a3'] && priceMapping['row-printing-a3'].price) {
            pricingConfig.prices.A3.bw = Number(priceMapping['row-printing-a3'].price);
            console.log('✅ Đã load giá đen trắng A3 từ localStorage:', pricingConfig.prices.A3.bw);
          }
          if (priceMapping['row-printing-a5'] && priceMapping['row-printing-a5'].price) {
            pricingConfig.prices.A5.bw = Number(priceMapping['row-printing-a5'].price);
            console.log('✅ Đã load giá đen trắng A5 từ localStorage:', pricingConfig.prices.A5.bw);
          }
          
          // Load giá màu theo khổ giấy
          if (priceMapping['row-printing-color-a4'] && priceMapping['row-printing-color-a4'].price) {
            pricingConfig.prices.A4.color = Number(priceMapping['row-printing-color-a4'].price);
            console.log('✅ Đã load giá màu A4 từ localStorage:', pricingConfig.prices.A4.color);
          }
          if (priceMapping['row-printing-color-a3'] && priceMapping['row-printing-color-a3'].price) {
            pricingConfig.prices.A3.color = Number(priceMapping['row-printing-color-a3'].price);
            console.log('✅ Đã load giá màu A3 từ localStorage:', pricingConfig.prices.A3.color);
          }
          if (priceMapping['row-printing-color-a5'] && priceMapping['row-printing-color-a5'].price) {
            pricingConfig.prices.A5.color = Number(priceMapping['row-printing-color-a5'].price);
            console.log('✅ Đã load giá màu A5 từ localStorage:', pricingConfig.prices.A5.color);
          }
          
          // Binding và Cover - giữ giá mặc định (không load từ localStorage nữa)
          // Giá mặc định: priceBinding: 5000, priceCoverPage: 2000

          // 2. Nếu không có trong localStorage, dùng giá mặc định (không load từ backend)
          // Vì giờ giá được quản lý qua localStorage, không cần backend nữa
          if (Object.keys(priceMapping).length === 0) {
            console.log('Không có giá trong localStorage, sử dụng giá mặc định.');
          }
        } catch (error) {
          console.error('Lỗi load pricing, sử dụng giá mặc định:', error);
        }
      }

      function calculateFilePrice(file) {
        // Lấy khổ giấy từ file (A4, A3, A5) - mặc định A4
        const paperSize = String(file.size || 'A4').toUpperCase();
        const priceBinding = pricingConfig.priceBinding;
        const priceCoverPage = pricingConfig.priceCoverPage;

        // Lấy giá theo khổ giấy và chế độ màu
        const paperPrices = pricingConfig.prices[paperSize] || pricingConfig.prices.A4;
        const pricePerPageBW = paperPrices.bw || 500;
        const pricePerPageColor = paperPrices.color || 3000;

        const totalPages =
          (Number(file.pages) || 0) * (Number(file.copies) || 1);
        let calculatedPrice = 0;
        // cách tính theo TỜ: 2 sides thì 1 tờ chứa 2 mặt in
        const isDouble = String(file.side || "")
          .toLowerCase()
          .includes("2");
        const sheets = isDouble ? Math.ceil(totalPages / 2) : totalPages;
        // Chuẩn hoá mode để không phụ thuộc ngôn ngữ
        const modeCode = normalizePrintMode(file.mode);

        if (modeCode === "bw") {
          calculatedPrice = sheets * pricePerPageBW;
        } else if (modeCode === "color") {
          calculatedPrice = sheets * pricePerPageColor;
        } else if (modeCode === "combination") {
          const colorPagesSingle = countColorPagesSpec(
            file.colorPages,
            file.pages
          );
          const colorFaces = colorPagesSingle * file.copies;
          const bwFaces = Math.max(0, totalPages - colorFaces);
          // Quy đổi theo TỜ: gom từng nhóm 2 mặt nếu in 2 sides
          const colorSheets = isDouble
            ? Math.ceil(colorFaces / 2)
            : colorFaces;
          const bwSheets = isDouble ? Math.ceil(bwFaces / 2) : bwFaces;
          calculatedPrice =
            bwSheets * pricePerPageBW + colorSheets * pricePerPageColor;
        }

        if (file.binding) calculatedPrice += priceBinding;
        if (file.coverPage) calculatedPrice += priceCoverPage;

        file.price = Math.round(calculatedPrice);

        return file.price;
      }

      function syncFileConfigurations() {
        let grandTotal = 0;

        uploadedFiles = uploadedFiles.map((file) => {
          const fileDiv = document.getElementById(`details-${file.id}`);

          if (fileDiv) {
            // --- Cập nhật giá trị từ DOM ---
            const copiesInput = fileDiv.querySelector(
              'div.option-group.flex-row input[type="number"]'
            );
            const copies = parseInt(copiesInput ? copiesInput.value : 1) || 1;
            file.copies = copies;

            const sizeSelect = fileDiv.querySelector(
              'select[data-field="paper"]'
            );
            file.size = sizeSelect ? sizeSelect.value : "A4";

            const sideSelect = fileDiv.querySelector(
              'select[data-field="side"]'
            );
            file.side = sideSelect ? sideSelect.value : "1 side";

            const selectedModeRadio = fileDiv.querySelector(
              `input[name="mode-${file.id}"]:checked`
            );
            if (selectedModeRadio) {
              file.mode = selectedModeRadio.parentNode.textContent
                .trim()
                .replace(/\s\(.*\)/, "");

              if (selectedModeRadio.value === "combination") {
                const colorPagesTextarea = fileDiv.querySelector(
                  `#color-pages-${file.id}`
                );
                file.colorPages = colorPagesTextarea
                  ? colorPagesTextarea.value.trim()
                  : "";
              } else {
                file.colorPages = "";
              }
            }

            const selectedTypeRadio = fileDiv.querySelector(
              `input[name="type-${file.id}"]:checked`
            );
            if (selectedTypeRadio) {
              file.type = selectedTypeRadio.value;
            }

            const bindingCheckbox = fileDiv.querySelector(
              '.checkbox-options input[data-field="binding"]'
            );
            const coverCheckbox = fileDiv.querySelector(
              '.checkbox-options input[data-field="cover"]'
            );

            if (file.type === "Thesis/Report") {
              file.binding = !!(bindingCheckbox && bindingCheckbox.checked);
              file.coverPage = !!(coverCheckbox && coverCheckbox.checked);
            } else {
              file.binding = false;
              file.coverPage = false;
            }
          }

          const newPrice = calculateFilePrice(file);
          grandTotal += newPrice;

          return file;
        });

        return grandTotal;
      }

            }">
                      <label>
                        <input type="checkbox" data-field="binding" ${file.binding ? "checked" : ""
            }>
                        <span data-i18n="print_doc.binding_label">
                          Binding (+5.000₫)
                        </span>
                      </label>
                      <label>
                        <input type="checkbox" data-field="cover" ${file.coverPage ? "checked" : ""
            }>
                        <span data-i18n="print_doc.cover_label">
                          Cover Page (+2.000₫)
                        </span>
                      </label>
                    </div>


                  </div>
              </div>`;
          // 👇 THÊM 2 DÒNG NÀY để tránh XSS cho tên file
          const nameStrong = div.querySelector(".file-title strong");
          if (nameStrong) nameStrong.textContent = file.name;
          if (window.i18n) {
            i18n.translateDom(div);
          }
          configContainer.appendChild(div);
        });

        addChangeListeners();
        updateSummary(true);
      }

      function updateSummary(sync = false) {
        if (sync) {
          syncFileConfigurations();
        }

        orderSummaryList.innerHTML = "";
        let total = 0;

        if (uploadedFiles.length === 0) {
          orderSummaryList.innerHTML = `<p class="text-muted">No files uploaded yet</p>`;
          orderSummaryList.innerHTML = `<p class="text-muted" data-i18n="print_doc.summary_empty">No files uploaded yet</p>`;
          if (window.i18n) {
            i18n.translateDom(orderSummaryList);
          }
          const filesSuffix = window.i18n
            ? i18n.t("print_doc.files_suffix")
            : "files";
          fileCountElement.textContent = `0 ${filesSuffix}`;
          btnPay.disabled = true;
          return;
        }

        uploadedFiles.forEach((f) => {
          total += f.price;

          // cập nhật card bên trái (file-config) cho khớp
          const priceEl = document.getElementById(`file-price-${f.id}`);
          if (priceEl) {
            priceEl.textContent = `${f.pages * f.copies
              } pages • ${formatCurrency(f.price)}`;
          }

          let details = `${f.pages * f.copies} pages total`;
          if (f.binding) details += " (+Binding)";
          if (f.coverPage) details += " (+Cover)";

          const item = document.createElement("div");
          item.classList.add("summary-file");
          item.innerHTML = `
              <div>
                  <strong></strong>
                  <div class="file-details">
                      ${f.copies} copy • ${f.size} • ${f.mode}<br>
                      ${details}
                  </div>
              </div>
              <div class="file-price">${formatCurrency(f.price)}</div>`;
          // 👇 THÊM 2 DÒNG NÀY để tránh XSS cho tên file
          const strongName = item.querySelector("strong");
          if (strongName) strongName.textContent = f.name;
          orderSummaryList.appendChild(item);
        });

        fileCountElement.textContent = `${uploadedFiles.length} file${uploadedFiles.length > 1 ? "s" : ""
          }`;
        const filesSuffix = window.i18n
          ? i18n.t("print_doc.files_suffix")
          : uploadedFiles.length > 1
            ? "files"
            : "file";
        fileCountElement.textContent = `${uploadedFiles.length} ${filesSuffix}`;
        totalPriceElement.textContent = formatCurrency(total);
        btnPay.disabled = false;

        if (window.i18n) {
          i18n.translateDom(orderSummaryList);
        }
      }

      // Map UI -> DB code
      function mapPaperCode(ui) {
        const x = String(ui || "A4").toUpperCase();
        return ["A3", "A4", "A5"].includes(x) ? x : "A4";
      }

      function mapSideCode(ui) {
        const s = String(ui || "").toLowerCase();
        if (s.includes("2")) return "DOUBLE";
        return "SINGLE";
      }

      function mapColorCode(ui) {
        const modeCode = normalizePrintMode(ui);
        // Backend hiện chỉ phân biệt BW vs COLOR,
        // nên "combination" cũng map về COLOR.
        return modeCode === "bw" ? "BW" : "COLOR";
      }

      // Lấy id theo code (paper/color/side)
      async function lookupIdsByCode(paperCode, colorCode, sideCode) {
        const url = `/api/orders/lookup-ids?paper=${encodeURIComponent(
          paperCode
        )}&color=${encodeURIComponent(colorCode)}&side=${encodeURIComponent(
          sideCode
        )}`;
        const r = await fetch(url, { credentials: "include" });

        // 👇 Bắt 401 trước khi parse JSON
        if (r.status === 401) {
          alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
          window.location.href = "/login";
          throw new Error("UNAUTHORIZED");
        }

        let data;
        try {
          data = await r.json();
        } catch {
          throw new Error("LOOKUP_IDS_PARSE_ERROR");
        }

        if (!r.ok || !data?.success) throw new Error("LOOKUP_IDS_FAILED");
        if (!data.paperSizeId || !data.colorModeId || !data.sideId)
          throw new Error("MISSING_REF_IDS");
        return data;
      }

      // ✨ THÊM CACHE NHẸ
      const _idCache = new Map(); // key = `${paper}|${color}|${side}`

      async function lookupIdsCached(paperCode, colorCode, sideCode) {
        const key = `${paperCode}|${colorCode}|${sideCode}`;
        if (_idCache.has(key)) return _idCache.get(key);
        const data = await lookupIdsByCode(paperCode, colorCode, sideCode);
        _idCache.set(key, data);
        return data;
      }

      // Tạo payload orderItems từ uploadedFiles hiện có
      async function buildOrderItems(files) {
        const items = [];
        for (const f of files) {
          const paperCode = mapPaperCode(f.size);
          const sideCode = mapSideCode(f.side);
          const colorCode = mapColorCode(f.mode);

          const ids = await lookupIdsCached(paperCode, colorCode, sideCode);

          // Tính lại tổng cho file này theo config hiện tại
          const totalForThisFile = calculateFilePrice(f); // đã set f.price = total

          const pages = Math.max(1, parseInt(f.pages, 10) || 1);
          const copies = Math.max(1, parseInt(f.copies, 10) || 1);

          // Đơn giá mỗi bản (1 file, full cấu hình)
          const unit =
            copies > 0 ? totalForThisFile / copies : totalForThisFile;

          const extraOptions = {
            // Thông tin hiển thị / Reorder
            type: f.type || "Regular",
            size: f.size || "A4",
            side: f.side || "1 side",
            mode: f.mode || "Black & White",
            printModeCode: normalizePrintMode(f.mode), // bw / color / combination
            colorPages: f.colorPages || "",
            // Lượng in
            pages,
            copies,
          };
          // Tuỳ chọn luận văn/báo cáo
          if (f.type === "Thesis/Report") {
            if (f.binding) extraOptions.binding = true;
            if (f.coverPage) extraOptions.coverPage = true;
          }

          items.push({
            printType: "DOCUMENT",
            pricingMode: "FIXED", // ⟵ vẫn tính theo gói
            paperSizeId: Number(ids.paperSizeId),
            colorModeId: Number(ids.colorModeId),
            sideId: Number(ids.sideId),
            pages,
            quantity: copies, // số bản in
            unitPrice: Number(unit).toFixed(2), // "12345.00"
            extraOptions,
            uploadedFileId: f.fileId || null, // ✅ Gửi fileId để backend cập nhật file với order
          });
        }
        return items;
      }

      function makeIdemKey() {
        return crypto?.randomUUID?.()
          ? crypto.randomUUID()
          : Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      async function createOrderOnBackend(orderItems, note, idemKey) {
        const r = await fetch("/api/orders", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Idempotency-Key": idemKey || makeIdemKey(), // chống tạo trùng, có fallback
          },
          credentials: "include",
          body: JSON.stringify({
            note: String(note ?? ""),
            orderItems,
          }),
        });

        if (r.status === 401) {
          alert("Bạn cần đăng nhập để tạo đơn.");
          window.location.href = "/login";
          throw new Error("UNAUTHORIZED");
        }

        let data = null;
        try {
          data = await r.json();
        } catch { }
        if (!r.ok) {
          console.error("Create order failed:", data);
          if (r.status === 400 && data?.errors?.length) {
            alert(
              "Dữ liệu không hợp lệ:\n" +
              data.errors.map((e) => `${e.path}: ${e.msg}`).join("\n")
            );
          } else {
            alert(data?.message || "CREATE_ORDER_FAILED");
          }
          throw new Error(data?.message || "CREATE_ORDER_FAILED");
        }
        return data.order; // full order (kèm items)
      }

      // === HÀM XỬ LÝ THANH TOÁN (LƯU DỮ LIỆU) ===
      btnPay.addEventListener("click", async () => {
        // Đồng bộ & tính tổng
        const grandTotal = syncFileConfigurations();

        // Check thông tin KH với validation đầy đủ
        const customerName = customerNameInput.value.trim();
        const customerEmail = customerEmailInput.value.trim();
        const specialRequest = specialRequestTextarea.value.trim();
        
        // Validate các trường
        if (!validateCustomerFields()) {
          return;
        }
        
        if (!customerName || !customerEmail) {
          const msg = window.i18n
            ? i18n.t("print_doc.alert_missing_customer")
            : "Vui lòng nhập đầy đủ họ tên và email.";
          alert(msg);
          return;
        }

        // Disable tránh double-click
        btnPay.disabled = true;
        // 👇 Thêm loading text
        const originalBtnText = btnPay.textContent;
        btnPay.textContent = window.i18n
          ? i18n.t("print_doc.btn_processing")
          : "Processing...";

        try {
          // 1) Build orderItems từ danh sách file
          const orderItems = await buildOrderItems(uploadedFiles);
          console.table(orderItems); // giữ 1 lần là đủ
          console.log("Payload →", {
            note: String(specialRequest ?? ""),
            orderItems,
          });

          // 2) Gửi tạo đơn ở backend (kèm idempotency key)
          const idemKey = crypto?.randomUUID?.()
            ? crypto.randomUUID()
            : Date.now() + "-" + Math.random().toString(16).slice(2);
          const order = await createOrderOnBackend(
            orderItems,
            specialRequest,
            idemKey
          );

          // 3) Lưu localStorage cho trang Payment + Confirmation
          // Chuẩn hoá trùng với backend genOrderCode (#ORD-YYYY-XXX)
          const createdAt = order.createdAt
            ? new Date(order.createdAt)
            : new Date();
          const year = createdAt.getFullYear();
          const orderCode = `#ORD-${year}-${String(order.id).padStart(
            3,
            "0"
          )}`;
          localStorage.setItem("backendOrderId", String(order.id));
          const orderForUi = {
            orderCode,
            service: "Print Documents",
            fileCount: uploadedFiles.length,
            customer: { name: customerName, email: customerEmail },
            files: uploadedFiles.map((f) => ({
              name: f.name,
              pages: f.pages,
              copies: f.copies,
              size: f.size,
              side: f.side,
              mode: f.mode,
              type: f.type, // để trang Confirm render đúng "Thesis/Report"
              binding: !!f.binding,
              coverPage: !!f.coverPage, // key này trang Confirm đang đọc là coverPage
              price: f.price,
            })),
            specialRequest,
            summary: {
              fileCount: uploadedFiles.length,
              totalPrice: grandTotal,
            },
          };
          localStorage.setItem(
            "currentOrderData",
            JSON.stringify(orderForUi)
          );
          localStorage.setItem("printOrderData", JSON.stringify(orderForUi));

          // 4) Chuyển sang trang XÁC NHẬN trước
          window.location.href = "/order/confirm";
        } catch (e) {
          console.error(e);
          const msg = window.i18n
            ? i18n.t("print_doc.alert_create_order_failed")
            : "Failed to create order. Please try again.";
          alert(msg);
        } finally {
          btnPay.disabled = false;
          btnPay.textContent = originalBtnText; // 👈 khôi phục
        }
      });

      // Lắng nghe thay đổi giá từ tab khác (cùng trình duyệt)
      let priceUpdateChannel = null;
      try {
        priceUpdateChannel = new BroadcastChannel('price-updates');
        priceUpdateChannel.onmessage = (event) => {
          if (event.data && event.data.type === 'price-updated') {
            const { rowId, priceMapping } = event.data;
            console.log('📢 Nhận thông báo cập nhật giá từ tab khác:', rowId, priceMapping);
            
            // Cập nhật pricingConfig
            if (priceMapping) {
              const paperSize = priceMapping.paperSize;
              const colorMode = priceMapping.colorMode;
              const price = priceMapping.price;
              
              if (paperSize && colorMode) {
                if (colorMode === 'BW') {
                  if (pricingConfig.prices[paperSize]) {
                    pricingConfig.prices[paperSize].bw = Number(price);
                    console.log(`✅ Đã cập nhật giá đen trắng ${paperSize} từ tab khác:`, price);
                  }
                } else if (colorMode === 'COLOR') {
                  if (pricingConfig.prices[paperSize]) {
                    pricingConfig.prices[paperSize].color = Number(price);
                    console.log(`✅ Đã cập nhật giá màu ${paperSize} từ tab khác:`, price);
                  }
                }
                
                // Tự động tính lại giá cho tất cả files
                updateSummary(true);
              }
            }
          }
        };
      } catch (e) {
        console.warn('BroadcastChannel không được hỗ trợ:', e);
      }

      // Set role cho tab này khi load trang (customer)
      try {
        sessionStorage.setItem("currentRole", "customer");
      } catch (e) {
        console.warn("Không thể set role:", e);
      }

      // === KHỞI TẠO BAN ĐẦU ===
      document.addEventListener("DOMContentLoaded", async () => {
        // Load giá từ backend trước
        await loadPricingFromBackend();
        
        if (uploadedFiles.length === 0) {
          configSection.style.display = "none";
        }
        // Nếu có preset, đưa note vào ô "Special request"
        if (_reorderPreset?.type === "DOCUMENT" && _reorderPreset?.note) {
          specialRequestTextarea.value = _reorderPreset.note;
        }
        updateSummary();
      });

      function goBack() {
        window.history.back();
      }
    </script>
  </main>
