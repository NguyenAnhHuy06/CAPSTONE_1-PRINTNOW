<!-- FE/html/Verify_OTP.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="otp.page_title">Email Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="../css/Verify_OTP.css" />
    <link
      href="https://cdn.boxicons.com/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />

    <style>
      /* A11y helper: văn bản chỉ dành cho screen reader */
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="container">
        <div class="icon"><i class="bxr bx-envelope"></i></div>
        <h2 data-i18n="otp.title">Email Verification</h2>
        <p id="otpSub" data-i18n="otp.subtitle">
          Enter the 6-digit code sent to your email
        </p>

        <div class="otp-field">
          <input type="text" maxlength="1" inputmode="numeric" />
          <input type="text" maxlength="1" inputmode="numeric" />
          <input type="text" maxlength="1" inputmode="numeric" />
          <input type="text" maxlength="1" inputmode="numeric" />
          <input type="text" maxlength="1" inputmode="numeric" />
          <input type="text" maxlength="1" inputmode="numeric" />
        </div>

        <div class="resend" data-i18n="otp.resend">Resend Code</div>
        <button id="verifyBtn" data-i18n="otp.verify">Verify</button>
        <div
          class="error"
          id="error"
          style="display: none"
          data-i18n="otp.error_invalid"
        >
          Invalid code. Please try again.
        </div>
      </div>

      <!-- Nhúng i18n trước khi script logic chạy -->
      <script src="/js/i18n.js"></script>
      <script>
        document.addEventListener("DOMContentLoaded", () => {
          const inputs = document.querySelectorAll(".otp-field input");
          const verifyBtn = document.getElementById("verifyBtn");
          const errorMsg = document.getElementById("error");
          const resendBtn = document.querySelector(".resend");
          const sub = document.getElementById("otpSub");

          // Cập nhật <title> theo i18n (nếu i18n đã load)
          try {
            document.title = i18n.t("otp.page_title");
          } catch {}

          // Nhận email & mode
          const urlParams = new URLSearchParams(window.location.search);
          const email =
            urlParams.get("email") ||
            sessionStorage.getItem("resetEmail") || // flow reset
            localStorage.getItem("registrationEmail") || // flow đăng ký
            "";
          const mode = (urlParams.get("mode") || "").toLowerCase(); // '' | 'reset'

          // Subtitle có email (giữ nguyên UI, chỉ i18n hoá text)
          if (email && window.i18n) {
            sub.innerHTML = i18n.f("otp.subtitle_email", { email });
          }

          // UX inputs (giữ nguyên)
          inputs.forEach((input, index) => {
            input.addEventListener("input", (e) => {
              let v = e.target.value.replace(/\D/g, "");
              if (v.length > 1) v = v.slice(-1);
              e.target.value = v;
              if (v && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener("keydown", (e) => {
              if (e.key === "Backspace" && !input.value && index > 0)
                inputs[index - 1].focus();
              if (e.key === "Enter") verifyBtn.click();
            });
            input.addEventListener("paste", (e) => {
              e.preventDefault();
              const pasted = e.clipboardData
                .getData("text")
                .replace(/\D/g, "")
                .slice(0, inputs.length);
              pasted.split("").forEach((c, i) => {
                if (inputs[i]) inputs[i].value = c;
              });
              (
                inputs[Math.min(pasted.length, inputs.length) - 1] || inputs[0]
              ).focus();
            });
          });

          // Verify (giữ flow cũ, chỉ đổi message -> i18n)
          verifyBtn.addEventListener("click", async () => {
            const otp = Array.from(inputs)
              .map((i) => i.value.trim())
              .join("");
            if (!/^\d{6}$/.test(otp)) {
              showErr(
                window.i18n
                  ? i18n.t("otp.error_fill6")
                  : "Please enter all 6 digits."
              );
              return;
            }
            if (!email) {
              showErr(
                window.i18n
                  ? i18n.t("otp.error_missing_email")
                  : "Email not found. Please try again."
              );
              return;
            }

            try {
              const endpoint =
                mode === "reset"
                  ? "/api/auth/verify-reset-otp"
                  : "/api/auth/verify-otp";
              const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, otp }),
              });
              const data = await res.json();

              if (res.ok && data.success) {
                errorMsg.style.display = "none";

                if (mode === "reset") {
                  // Nhận resetToken và chuyển trang đặt mật khẩu
                  if (data.resetToken)
                    sessionStorage.setItem("resetToken", data.resetToken);
                  sessionStorage.setItem("resetEmail", email);
                  window.location.href = "/reset-password";
                } else {
                  localStorage.removeItem("registrationEmail");
                  alert(
                    window.i18n
                      ? i18n.t("otp.alert_verified")
                      : "Verification successful! You can now log in."
                  );
                  window.location.href = "/login";
                }
              } else {
                showErr(
                  (window.i18n && i18n.t("otp.error_invalid")) ||
                    data.message ||
                    "Invalid OTP. Please try again."
                );
                inputs.forEach((i) => (i.value = ""));
                inputs[0].focus();
              }
            } catch (e) {
              console.error("Verification error:", e);
              showErr(
                window.i18n
                  ? i18n.t("otp.error_generic")
                  : "Something went wrong. Please try again."
              );
            }
          });

          // Resend (giữ flow cũ, chỉ đổi message -> i18n)
          resendBtn.addEventListener("click", async () => {
            if (!email) {
              alert(
                window.i18n
                  ? i18n.t("otp.error_missing_email")
                  : "Email not found. Please try again."
              );
              return;
            }
            try {
              const endpoint =
                mode === "reset"
                  ? "/api/auth/resend-reset-otp"
                  : "/api/auth/resend-otp";
              const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
              });
              const data = await res.json();
              if (res.ok && data.success) {
                alert(
                  window.i18n
                    ? i18n.t("otp.resend_ok")
                    : "A new OTP has been sent."
                );
                errorMsg.style.display = "none";
              } else {
                alert(
                  (window.i18n && i18n.t("otp.resend_fail")) ||
                    data.message ||
                    "Could not resend OTP. Please try again later."
                );
              }
            } catch (e) {
              console.error("Resend OTP error:", e);
              alert(
                window.i18n
                  ? i18n.t("otp.error_generic")
                  : "Something went wrong. Please try again later."
              );
            }
          });

          function showErr(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
          }

          // Khi đổi ngôn ngữ runtime, cập nhật title & subtitle
          window.addEventListener("lang-changed", () => {
            try {
              document.title = i18n.t("otp.page_title");
            } catch {}
            if (email && window.i18n) {
              sub.innerHTML = i18n.f("otp.subtitle_email", { email });
            }
          });
        });
      </script>
    </main>
  </body>
</html>
