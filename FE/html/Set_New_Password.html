<!-- FE/html/Set_New_Password.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="setpw.page_title">Set New Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../css/Set_New_Password.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- i18n -->
    <script src="/FE/js/i18n.js"></script>

    <style>
      /* A11y helper: văn bản chỉ dành cho screen reader */
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
    </style>
  </head>

  <body>
    <main role="main">
      <div class="container" aria-labelledby="page-title">
        <form id="resetForm" novalidate>
          <i class="bx bx-lock-open lock-icon" aria-hidden="true"></i>

          <h2 id="page-title" data-i18n="setpw.title">Set New Password</h2>
          <p class="desc" data-i18n="setpw.desc">
            Create a new password to secure your account.
          </p>

          <div class="input-box">
            <i class="bx bx-lock" aria-hidden="true"></i>
            <input
              type="password"
              id="newPass"
              data-i18n-placeholder="setpw.placeholder_new"
              placeholder="New Password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <i
              class="bx bx-eye-slash toggle-pass"
              id="toggleNewPass"
              role="button"
              tabindex="0"
              data-i18n-aria-label="a11y.toggle_password"
              aria-label="Toggle password visibility"
            ></i>
          </div>

          <div class="input-box">
            <i class="bx bx-lock" aria-hidden="true"></i>
            <input
              type="password"
              id="confirmPass"
              data-i18n-placeholder="setpw.placeholder_confirm"
              placeholder="Confirm New Password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <i
              class="bx bx-eye-slash toggle-pass"
              id="toggleConfirmPass"
              role="button"
              tabindex="0"
              data-i18n-aria-label="a11y.toggle_password"
              aria-label="Toggle password visibility"
            ></i>
          </div>

          <!-- vùng thông báo -->
          <div
            id="errorMsg"
            class="error-msg"
            role="alert"
            aria-live="assertive"
          ></div>

          <button
            class="btn"
            id="confirmBtn"
            type="submit"
            data-i18n="setpw.btn_confirm"
          >
            Confirm
          </button>

          <!-- trạng thái ẩn cho SR khi chuyển ngôn ngữ -->
          <div
            id="srStatus"
            class="sr-only"
            role="status"
            aria-live="polite"
          ></div>
        </form>
      </div>
    </main>

    <script>
      const T = (k, fb) => window.i18n?.t(k) || fb;

      function togglePassword(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        if (!toggle || !input) return;

        const doToggle = () => {
          const isPw = input.type === "password";
          input.type = isPw ? "text" : "password";
          toggle.classList.toggle("bx-eye");
          toggle.classList.toggle("bx-eye-slash");
        };

        toggle.addEventListener("click", doToggle);
        toggle.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " " || e.code === "Space") {
            e.preventDefault();
            doToggle();
          }
        });
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("newPass").classList.add("error");
        document.getElementById("confirmPass").classList.add("error");
        el.classList.remove("shake");
        void el.offsetWidth; // restart animation
        el.classList.add("shake");
      }
      function clearError() {
        const el = document.getElementById("errorMsg");
        el.textContent = "";
        el.style.display = "none";
        document.getElementById("newPass").classList.remove("error");
        document.getElementById("confirmPass").classList.remove("error");
      }

      // chính sách: >=8, có ít nhất 1 chữ hoa & 1 số
      const policy = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

      document.addEventListener("DOMContentLoaded", () => {
        // init toggles
        togglePassword("toggleNewPass", "newPass");
        togglePassword("toggleConfirmPass", "confirmPass");

        const form = document.getElementById("resetForm");
        const btn = document.getElementById("confirmBtn");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          clearError();

          const pass1 = document.getElementById("newPass").value.trim();
          const pass2 = document.getElementById("confirmPass").value.trim();

          if (!pass1 || !pass2)
            return showError(
              T("setpw.err_empty", "Please fill in both fields.")
            );
          if (pass1 !== pass2)
            return showError(
              T("setpw.err_mismatch", "Passwords do not match!")
            );
          if (!policy.test(pass1)) {
            return showError(
              T(
                "setpw.err_policy",
                "Password must be ≥8 chars, include an uppercase letter and a number."
              )
            );
          }

          // token: ưu tiên sessionStorage, fallback query ?token=
          let token = sessionStorage.getItem("resetToken");
          if (!token) {
            const params = new URLSearchParams(location.search);
            token = params.get("token");
          }
          if (!token) {
            return showError(
              T(
                "setpw.err_token",
                "Missing reset token. Please request OTP again."
              )
            );
          }

          try {
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = T("setpw.processing", "Processing...");

            const res = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, password: pass1 }),
            });
            const data = await res.json();

            if (res.ok && (data.success ?? true)) {
              sessionStorage.removeItem("resetToken");
              sessionStorage.removeItem("resetEmail");
              alert(
                T("setpw.success", "Password has been reset successfully!")
              );
              window.location.href = "/login";
            } else {
              showError(
                data.message || T("setpw.failed", "Password reset failed")
              );
            }

            btn.textContent = original;
            btn.disabled = false;
          } catch (err) {
            console.error("Reset password error:", err);
            showError(
              T(
                "alert.generic_error",
                "Something went wrong. Please try again."
              )
            );
            btn.disabled = false;
            btn.textContent = T("setpw.btn_confirm", "Confirm");
          }
        });

        // cập nhật tiêu đề/nút khi đổi ngôn ngữ
        window.addEventListener("lang-changed", () => {
          document.title = T("setpw.page_title", document.title);
          document.getElementById("confirmBtn").textContent = T(
            "setpw.btn_confirm",
            "Confirm"
          );
          document.getElementById("srStatus").textContent = T(
            "setpw.page_title",
            ""
          );
        });
      });
    </script>
  </body>
</html>
